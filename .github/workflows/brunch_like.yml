name: Brunch Auto Like (브런치 연재글 자동 좋아요)

on:
  # 1. GitHub 웹에서 사용자가 수동으로 즉시 실행 (버튼 클릭)
  workflow_dispatch:
    inputs:
      day:
        description: '연재 요일 선택'
        required: true
        default: 'tue'
        type: choice
        options:
          - 'tue'
          - 'mon'
          - 'wed'
          - 'thu'
          - 'fri'
          - 'sat'
          - 'sun'
          - 'com'
      order:
        description: '정렬 기준'
        required: true
        default: 'PUBLISH_TIME'
        type: choice
        options:
          - 'PUBLISH_TIME'
          - 'POPULARITY'
      min_interval:
        description: '최소 대기 시간 (랜덤 초 단위, 기본: 1)'
        required: true
        default: '1'
      max_interval:
        description: '최대 대기 시간 (랜덤 초 단위, 기본: 30)'
        required: true
        default: '30'
      max_count:
        description: '최대 처리할 글 수 (0이면 해당 요일 전체)'
        required: false
        default: '0'

  # 2. 정기 자동 실행 (매주 화요일 한국시간 오전 09:00 / UTC 00:00)
  schedule:
    - cron: '0 0 * * 2'

jobs:
  auto-like:
    runs-on: ubuntu-latest
    name: Run Brunch Like Scheduler

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 브런치 자동 좋아요 실행 (1초~30초 랜덤 간격)
        env:
          BRUNCH_COOKIE: ${{ secrets.BRUNCH_COOKIE }}
        run: |
          DAY="${{ github.event.inputs.day || 'tue' }}"
          ORDER="${{ github.event.inputs.order || 'PUBLISH_TIME' }}"
          MIN_INT="${{ github.event.inputs.min_interval || '1' }}"
          MAX_INT="${{ github.event.inputs.max_interval || '30' }}"
          MAX_COUNT="${{ github.event.inputs.max_count || '0' }}"

          echo "============================================="
          echo " 대상 요일: $DAY"
          echo " 정렬 기준: $ORDER"
          echo " 대기 간격: ${MIN_INT}초 ~ ${MAX_INT}초 (랜덤)"
          echo " 최대 개수: $MAX_COUNT"
          echo " 타겟 버튼: 우측 상단 하트 아이콘"
          echo "============================================="

          python cli.py \
            --day "$DAY" \
            --order "$ORDER" \
            --min-interval "$MIN_INT" \
            --max-interval "$MAX_INT" \
            --max-count "$MAX_COUNT"
